<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lorenz Attractor</title>

    <style>
        body {
            margin: 0;
            background: #111;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 800px;
            max-width: 90vw;
            height: auto;

            background: #000;
            border: 1px solid white;
        }

        .lorenz {
            fill: none;
            stroke: white;
            stroke-width: 0.7;
            stroke-linecap: round;
            stroke-linejoin: round;

            /*
             * Makes the animation work
             * regardless of the path length.
             */
            stroke-dasharray: 0.02 0.01;
            stroke-dashoffset: 0;

            opacity: 0.9;

            animation:
                draw 30s linear infinite;
        }

        @keyframes draw {
            from {
                stroke-dashoffset: 1;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        text {
            font-family: monospace;
            font-size: 9px;
            fill: white;
        }
    </style>
</head>

<body>

<svg
    viewBox="0 0 500 280"
    width="500"
    height="280">

    <rect
        width="500"
        height="280"
        fill="#000"
    />

    <path
        id="lorenzPath"
        class="lorenz"
        pathLength="1"
    />

    <text x="10" y="270">
        Lorenz Attractor  σ=10  ρ=35  β=8/3
    </text>

</svg>

<script>

    // =========================
    // LORENZ PARAMETERS
    // =========================

    const sigma = 10;
    const rho = 35;
    const beta = 8 / 3;

    const dt = 0.005;
    const steps = 20000;

    let x = 0.1;
    let y = 0;
    let z = 0;

    const points = [];

    // =========================
    // CALCULATE LORENZ SYSTEM
    // =========================

    for (let i = 0; i < steps; i++) {

        const dx = sigma * (y - x);
        const dy = x * (rho - z) - y;
        const dz = x * y - beta * z;

        x += dx * dt;
        y += dy * dt;
        z += dz * dt;

        if (i > 500) {
            points.push({
                x: x,
                z: z
            });
        }
    }

    // =========================
    // FIND BOUNDS
    // =========================

    let minX = Infinity;
    let maxX = -Infinity;

    let minZ = Infinity;
    let maxZ = -Infinity;

    points.forEach(point => {

        minX = Math.min(minX, point.x);
        maxX = Math.max(maxX, point.x);

        minZ = Math.min(minZ, point.z);
        maxZ = Math.max(maxZ, point.z);

    });

    // =========================
    // SVG SIZE
    // =========================

    const width = 500;
    const height = 250;

    const padding = 25;

    const availableWidth = width - padding * 2;
    const availableHeight = height - padding * 2;

    const dataWidth = maxX - minX;
    const dataHeight = maxZ - minZ;

    // Keep the original aspect ratio
    const scale = Math.min(
        availableWidth / dataWidth,
        availableHeight / dataHeight
    );

    // Center the attractor
    const renderedWidth = dataWidth * scale;
    const renderedHeight = dataHeight * scale;

    const offsetX =
        (width - renderedWidth) / 2;

    const offsetY =
        (height - renderedHeight) / 2;

    // =========================
    // CREATE SVG PATH
    // =========================

    let pathData = "";

    points.forEach((point, index) => {

        const screenX =
            (point.x - minX) * scale + offsetX;

        const screenY =
            height -
            ((point.z - minZ) * scale + offsetY);

        if (index === 0) {

            pathData +=
                `M ${screenX} ${screenY}`;

        } else {

            pathData +=
                ` L ${screenX} ${screenY}`;

        }

    });

    // =========================
    // APPLY PATH
    // =========================

    document
        .getElementById("lorenzPath")
        .setAttribute("d", pathData);

</script>

</body>
</html>
